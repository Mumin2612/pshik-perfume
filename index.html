<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pshik Perfume</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1 class="logo">Pshik Perfume</h1>
            <p class="tagline">Premium Oils • Russia</p>
            
            <div class="cart-btn-container">
                <button id="open-cart-btn" class="cart-button">
                    🛒 Корзина (<span id="cart-count">0</span>)
                </button>
            </div>
        </header>

        <div id="catalog" class="catalog-grid"></div>

        <div id="cart-overlay" class="overlay">
            <div class="overlay-header">
                <h2>Ваш заказ</h2>
                <button class="close-btn" onclick="hideCart()">✕</button>
            </div>
            
            <div id="cart-list" class="cart-list">
                </div>
            
            <div class="checkout-footer">
                <div class="total-row">
                    <span>Итого к оплате:</span>
                    <span id="overlay-total">0 ₽</span>
                </div>
                
                <button id="checkout-btn" class="order-btn" style="margin-top: 15px; margin-bottom: 10px;">
                    Оформить заказ
                </button>

                <div class="order-info">
                    <p>После нажатия кнопки «Оформить заказ» мы свяжемся с вами в Telegram для уточнения адреса доставки.</p>
                </div>
            </div>
        </div>
    </div>

    <div id="gallery-overlay" class="overlay" style="background-color: rgba(0,0,0,0.95); justify-content: center; align-items: center; display: none;">
    <button class="close-btn" onclick="closeGallery()" style="position: absolute; top: 20px; right: 20px; font-size: 32px;">✕</button>
    <button class="gallery-arrow" onclick="prevImg()" style="position: absolute; left: 15px; background: transparent; border: none; color: #D4B78F; font-size: 40px; cursor: pointer;">‹</button>
    <img id="gallery-img" src="" style="max-width: 90%; max-height: 75vh; border-radius: 8px; object-fit: contain;">
    <button class="gallery-arrow" onclick="nextImg()" style="position: absolute; right: 15px; background: transparent; border: none; color: #D4B78F; font-size: 40px; cursor: pointer;">›</button>
</div>

<div id="preorder-overlay" class="overlay">
    <div class="overlay-header">
        <h2>Оформить предзаказ</h2>
        <button class="close-btn" onclick="hidePreorder()">✕</button>
    </div>
    <div style="padding: 10px 0;">
        <p style="color: #8E8E93; font-size: 13px; margin-bottom: 15px;">Напишите название духов, которые вы ищете, и мы привезем их специально для вас!</p>
        <label style="display:block; margin-bottom: 5px; color:#D4B78F; font-size: 12px; font-weight:600;">Название духов и бренд:</label>
        <input type="text" id="preorder-name" placeholder="Например: Tom Ford Lost Cherry" style="width:100%; padding:12px; background:#1A1A1A; border:1px solid #2C2C2C; border-radius:8px; color:#fff; margin-bottom:15px; font-size:14px; outline:none;">
        
        <label style="display:block; margin-bottom: 5px; color:#D4B78F; font-size: 12px; font-weight:600;">Желаемый объем:</label>
        <input type="text" id="preorder-vol" placeholder="Например: 30 мл или 50 мл" style="width:100%; padding:12px; background:#1A1A1A; border:1px solid #2C2C2C; border-radius:8px; color:#fff; margin-bottom:20px; font-size:14px; outline:none;">
        
        <button class="order-btn" onclick="sendPreorder()">Отправить запрос</button>
    </div>
</div>

    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
